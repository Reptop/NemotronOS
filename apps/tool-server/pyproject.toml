[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotronos-tool-server"
version = "0.1.0"
description = "Mock and future Windows tool server for NemotronOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "pillow>=10.3.0",
  "playwright>=1.52.0",
  "pyautogui>=0.9.54",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.29.0",
]

[tool.setuptools.packages.find]
include = ["nemotronos_tools*"]
