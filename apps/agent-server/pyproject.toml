[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotronos-agent-server"
version = "0.1.0"
description = "Agent runtime for NemotronOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.29.0",
]

[tool.setuptools.packages.find]
include = ["nemotronos_agent*"]
